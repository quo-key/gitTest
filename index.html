<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>这都是小玩意！全女士</title>
<style>
*{margin:0;padding:0}
html,body{
  height:100%;
  background:#030012;
  overflow:hidden;
}
canvas{
  display:block;
}
#textBox{
  position:fixed;
  width:100%;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.6s ease;
  z-index:10;
}
#loveText{
  color:#ffffff;
  font-size:24px;
  line-height:2;
  font-family:"PingFang SC",Microsoft YaHei,sans-serif;
  text-shadow: 0 0 16px rgba(255,80,120,0.85);
  padding:0 20px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="textBox">
  <div id="loveText">
    雯俊大大<br>
    世间万般风景<br>
    我只想和你慢慢走过
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const textBox = document.getElementById('textBox');

const TEXT_DURATION = 3000;

let w,h,dpr;
let state = "redHeart";
let busy = false;

let particles = [];
let fireworks = [];

function resize(){
  dpr = window.devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener("resize",resize);

// 标准圆润爱心公式
function heartPoint(t){
  const x = 16 * Math.pow(Math.sin(t),3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return {x,y};
}

function buildHeartPoints(count = 800){
  const pts = [];
  for(let i = 0; i < count; i++){
    const t = Math.random() * Math.PI * 2;
    const edge = heartPoint(t);
    const r = Math.sqrt(Math.random());
    pts.push({
      x: edge.x * r,
      y: edge.y * r,
      // 马卡龙低饱和色系
      hue: [195,220,280,330,10,45][Math.floor(Math.random()*6)]
    });
  }
  return pts;
}

class Particle{
  constructor(origin){
    this.origin = origin;
    this.x = 0;
    this.y = 0;
    this.vx = 0;
    this.vy = 0;
    this.size = Math.random() * 2.6 + 1.3;
    this.hue = origin.hue;
  }

  explode(){
    const angle = Math.random() * Math.PI * 2;
    const power = 70 + Math.random() * 110;
    this.vx = Math.cos(angle) * power;
    this.vy = Math.sin(angle) * power;
  }

  update(){
    const cx = w / 2;
    const cy = h / 2;
    const scale = Math.min(w, h) / 46;
    const targetX = cx + this.origin.x * scale;
    const targetY = cy + this.origin.y * scale;

    if(state === "firework"){
      this.vx *= 0.91;
      this.vy *= 0.91;
      this.x += this.vx;
      this.y += this.vy;
    }

    if(state === "settleRainbow"){
      this.x += (targetX - this.x) * 0.055;
      this.y += (targetY - this.y) * 0.055;
    }

    if(state === "firework" || state === "settleRainbow"){
      const color = `hsl(${this.hue}, 75%, 68%)`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.fill();
    }
  }
}

class Firework {
  constructor(x, y){
    this.x = x;
    this.y = y;
    this.particles = [];
    this.life = 1;

    for(let i = 0; i < 70; i++){
      const angle = (i / 70) * Math.PI * 2;
      const power = 35 + Math.random() * 70;
      const hue = [200,260,320,350][Math.floor(Math.random()*4)];
      this.particles.push({
        x,y,
        vx: Math.cos(angle) * power,
        vy: Math.sin(angle) * power,
        size: Math.random() * 2.8 + 1,
        hue,
        alpha:1
      });
    }
  }

  update(){
    this.life -= 0.017;
    for(const p of this.particles){
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha = Math.max(0, this.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},75%,68%,${p.alpha})`;
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    return this.life > 0;
  }
}

// 背景星光
let stars = [];
function createStar(count = 180){
  stars = [];
  for(let i = 0; i < count; i++){
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      s: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }
}
createStar();

const originPoints = buildHeartPoints(800);
originPoints.forEach(p => {
  particles.push(new Particle(p));
});

// 初始：高级正红色爱心
function drawRedHeart(time){
  const cx = w / 2;
  const cy = h / 2;
  const beatScale = 1 + Math.sin(time * 0.0028) * 0.022;
  const baseScale = Math.min(w, h) / 46 * beatScale;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  for(let t = 0; t <= Math.PI * 2; t += 0.012){
    const p = heartPoint(t);
    const x = p.x * baseScale;
    const y = p.y * baseScale;
    t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  // 沉稳红渐变，不艳俗
  const grad = ctx.createRadialGradient(0,0,0,0,0,130);
  grad.addColorStop(0,"#ff647c");
  grad.addColorStop(1,"#d82840");
  ctx.fillStyle = grad;
  ctx.shadowColor = "#c92239";
  ctx.shadowBlur = 30;
  ctx.fill();
  ctx.restore();
}

// 最终成型：静态粉紫温柔爱心（不再动态流动彩虹）
function drawFinalHeart(time){
  const cx = w / 2;
  const cy = h / 2;
  const beatScale = 1 + Math.sin(time * 0.0028) * 0.022;
  const baseScale = Math.min(w, h) / 46 * beatScale;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  for(let t = 0; t <= Math.PI * 2; t += 0.012){
    const p = heartPoint(t);
    const x = p.x * baseScale;
    const y = p.y * baseScale;
    t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  // 固定粉紫渐变，静态不变色，高级耐看
  const grad = ctx.createRadialGradient(0,0,0,0,0,130);
  grad.addColorStop(0,"#ffb4d2");
  grad.addColorStop(1,"#b864c7");
  ctx.fillStyle = grad;
  ctx.shadowColor = "#a052ad";
  ctx.shadowBlur = 32;
  ctx.fill();
  ctx.restore();
}

function drawStar(time){
  ctx.save();
  for(let s of stars){
    s.phase += 0.022;
    const alpha = 0.25 + Math.abs(Math.sin(s.phase)) * 0.45;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
  ctx.restore();
}

canvas.onclick = async () => {
  if(busy) return;
  busy = true;
  const cx = w / 2;
  const cy = h / 2;
  state = "firework";

  // 生成多处烟花
  for(let i = 0; i < 5; i++){
    setTimeout(()=>{
      fireworks.push(new Firework(
        cx + (Math.random()-0.5)*180,
        cy + (Math.random()-0.5)*180
      ))
    },i*130);
  }
  particles.forEach(p=>p.explode());

  await sleep(600);
  textBox.style.opacity = "1";

  await sleep(TEXT_DURATION);
  textBox.style.opacity = "0";

  await sleep(800);
  state = "settleRainbow";

  await sleep(1800);
  state = "finalHeart";
  busy = false;
};

function sleep(ms){
  return new Promise(res=>setTimeout(res,ms));
}

function loop(time){
  ctx.fillStyle = "rgba(3,0,18,0.18)";
  ctx.fillRect(0,0,w,h);
  drawStar(time);
  fireworks = fireworks.filter(f=>f.update());
  particles.forEach(p=>p.update());

  if(state === "redHeart") drawRedHeart(time);
  if(state === "finalHeart") drawFinalHeart(time);

  requestAnimationFrame(loop);
}
loop(0);
</script>
</body>
</html>
