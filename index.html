<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>爱心动画</title>
<style>
*{margin:0;padding:0}
html,body{
  height:100%;
  background:#050010;
  overflow:hidden;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let w,h,dpr;

function resize(){
  dpr = window.devicePixelRatio || 1;
  w = innerWidth;
  h = innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize',resize);

// 爱心轮廓点
function heartPoint(t){
  const x = 16 * Math.pow(Math.sin(t),3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return {x,y:-y};
}

// 生成实心爱心内部点：轮廓点 + 三角剖分随机点
function createHeartPoints(count){
  const points = [];

  // 轮廓点
  for(let i = 0; i < 64; i++){
    const t = (i / 64) * Math.PI * 2;
    points.push(heartPoint(t));
  }

  // 内部填充点
  for(let i = 0; i < count; i++){
    const t = Math.random() * Math.PI * 2;
    const edge = heartPoint(t);
    const radius = Math.sqrt(Math.random());
    points.push({
      x: edge.x * radius,
      y: edge.y * radius
    });
  }

  return points;
}

class Particle {
  constructor(target){
    this.target = target;
    this.originX = target.x;
    this.originY = target.y;
    this.x = target.x;
    this.y = target.y;
    this.vx = 0;
    this.vy = 0;
    this.alpha = 1;
    this.size = Math.random() * 2.5 + 1.2;
    this.settled = false;
  }

  explode(){
    const angle = Math.random() * Math.PI * 2;
    const force = Math.random() * 120 + 60;
    this.vx = Math.cos(angle) * force;
    this.vy = Math.sin(angle) * force;
    this.settled = false;
  }

  update(time){
    const centerX = w / 2;
    const centerY = h / 2;
    const scale = Math.min(w,h) / 48;

    const targetX = centerX + this.originX * scale;
    const targetY = centerY + this.originY * scale;

    if(this.settled){
      this.x += (targetX - this.x) * 0.08;
      this.y += (targetY - this.y) * 0.08;
      this.vx *= 0.85;
      this.vy *= 0.85;
    }else{
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.x += this.vx;
      this.y += this.vy;

      if(Math.abs(this.vx) < 1.5 && Math.abs(this.vy) < 1.5){
        this.settled = true;
      }
    }

    // 轻微心跳
    const beat = 1 + Math.sin(time * 0.003) * 0.015;
    this.draw(targetX, targetY, beat);
  }

  draw(tx, ty, beat){
    ctx.save();

    const dx = this.x - tx;
    const dy = this.y - ty;

    ctx.translate(tx + dx * beat, ty + dy * beat);

    ctx.beginPath();
    ctx.arc(0, 0, this.size * beat, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,45,90,${this.alpha})`;
    ctx.shadowColor = '#ff2d5a';
    ctx.shadowBlur = this.size * 2;
    ctx.fill();

    ctx.restore();
  }
}

// 创建实心爱心粒子
const heartData = createHeartPoints(520);
const particles = heartData.map(p => new Particle(p));

// 背景星星
const stars = [];
for(let i = 0; i < 120; i++){
  stars.push({
    x: Math.random() * w,
    y: Math.random() * h,
    size: Math.random() * 1.5 + 0.5,
    twinkle: Math.random() * Math.PI * 2
  });
}

function drawStars(time){
  ctx.save();
  for(const s of stars){
    s.twinkle += 0.025;
    const alpha = 0.3 + Math.abs(Math.sin(s.twinkle)) * 0.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
  ctx.restore();
}

let lastExplode = 0;
const autoRecoverDelay = 1800;

canvas.onclick = () => {
  lastExplode = performance.now();
  for(const p of particles){
    p.explode();
  }
};

function loop(){
  const time = performance.now();

  ctx.fillStyle = 'rgba(5,0,16,0.18)';
  ctx.fillRect(0,0,w,h);

  drawStars(time);

  // 点击后一段时间自动合拢
  if(time - lastExplode > autoRecoverDelay){
    for(const p of particles){
      p.settled = true;
    }
  }

  for(const p of particles){
    p.update(time);
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
